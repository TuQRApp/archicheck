[pytest]
addopts = --ignore=test_threshold_bajo.py -m "not golden"
# test_threshold_bajo.py no es un test real -- es un script para pegar
# en una celda de Colab (requiere torch/cuda, reutiliza variables ya
# cargadas ahi). pytest lo colecciona igual por el nombre "test_*.py" y
# rompe toda la corrida si torch no esta instalado localmente.
#
# "-m not golden" en addopts excluye los tests golden (lentos, corren
# el pipeline real completo) de cualquier corrida normal de "pytest" --
# para correrlos a proposito, pasar "-m golden" explicito en la linea
# de comandos (el -m de la CLI pisa el de addopts, no se combinan).
markers =
    golden: corre el pipeline completo contra los 3 proyectos reales (PdV/Beauchef/Campo Lindo) y compara contra baselines conocidos. LENTO (~10-15 min todos juntos, Beauchef solo son ~4-5 min) -- requiere los PDF reales en Fase 2/Desarrollos/Test/. No corre por defecto (ver -m).
